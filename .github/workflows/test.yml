name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2

      - uses: extractions/setup-just@v4
        with:
          just-version: "1.58.0"

      - name: Cache dependency downloads
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.4.3-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-1.4.3-

      - name: Install dependencies
        run: just setup

      - name: Check source and coverage
        run: just check

      - name: Build and sanity-check package
        run: just sanity-check

      - name: Verify npm package contents
        run: just pack-check
