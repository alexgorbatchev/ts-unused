name: Release npm Package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - uses: extractions/setup-just@v4
        with:
          just-version: "1.58.0"

      - name: Cache dependency downloads
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.4.3-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-1.4.3-

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Derive release version from tag
        run: |
          set -euo pipefail
          release_version="${GITHUB_REF_NAME#v}"
          if [[ -z "$release_version" || "$release_version" == "$GITHUB_REF_NAME" ]]; then
            echo "Expected a tag like v1.2.3, got: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "RELEASE_VERSION=$release_version" >> "$GITHUB_ENV"

      - name: Sync package version from the release tag
        run: npm pkg set version="$RELEASE_VERSION"

      - name: Install dependencies
        run: just setup

      - name: Check source and coverage
        run: just check

      - name: Build and sanity-check package
        run: just sanity-check

      - name: Verify npm package contents
        run: just pack-check

      - name: Publish package
        run: npm publish --provenance --access public
